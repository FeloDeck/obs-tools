[package]
name = "obs-tools"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "OBS Tools plugin for OpenDeck"

[[bin]]
name = "obs-tools"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
log = "0.4"
openaction = "2.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1" }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "process", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = "0.28"
ureq = { version = "3", default-features = false, features = ["rustls"] }
webpki-roots = "1"

[dev-dependencies]
boa_engine = { version = "0.22", default-features = false }
regex = "1"
tokio = { version = "1", features = ["test-util"] }

[workspace]
members = ["xtask", "tools/virtual-deck"]

# No debug info: smaller and faster builds.
[profile.dev]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true

